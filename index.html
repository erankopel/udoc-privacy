<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uDoc</title>
<style>
  :root { --bg: #ffffff; --fg: #1d2330; --link: #1a56c4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181f; --fg: #e6e9ef; --link: #8ab4ff; } }
  html { background: var(--bg); color: var(--fg); }
  body { font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 42rem; margin: 0 auto; padding: 3rem 1rem; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
<h1>uDoc</h1>
<p>A word processor for your phone. Open, edit and save .docx documents with no ads and no tracking.</p>
<p><a href="privacy">Privacy policy</a></p>
</main>
</body>
</html>
